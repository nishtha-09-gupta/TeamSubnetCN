# Include from nginx http{} on the original edge. Passive failure detection only.
upstream backend_pool {
    server 10.7.30.234:3001 max_fails=1 fail_timeout=10s;
    server 10.7.1.114:3002 max_fails=1 fail_timeout=10s;
    keepalive 16;
}
server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name app.teamX.test api.teamX.test;
    ssl_certificate /opt/homebrew/etc/nginx/certs/edge.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/edge.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Edge $hostname always;
    }
}
