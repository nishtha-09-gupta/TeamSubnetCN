# Phase 2 active edge: 10.7.13.91 (Phase 1 edge: 10.7.28.24).
# Install as /opt/homebrew/etc/nginx/servers/teamx.conf on that edge.
# TLS paths and server names retain the Phase 1 deployment values.

upstream backend_pool {
    server 10.7.30.234:3001  max_fails=1 fail_timeout=10s;   # Backend A (Phase 2 evidence)
    server 10.7.1.114:3002  max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
}

server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/edge.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Edge $hostname always;
    }
}

# Validate:  nginx -t
# Reload:    nginx -s reload     (or: brew services restart nginx)
