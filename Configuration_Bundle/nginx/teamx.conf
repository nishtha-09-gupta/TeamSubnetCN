# Mac 2 (10.7.28.24): /opt/homebrew/etc/nginx/servers/teamx.conf
#
# NOTE: reconstructed from the screenshots/figures in the evidence document.
# BEFORE SUBMITTING, replace this file with the real one:
#   cat /opt/homebrew/etc/nginx/servers/teamx.conf

upstream backend_pool {
    server 10.7.9.8:3001     max_fails=1 fail_timeout=10s;   # Backend A (Mac 3)
    server 10.7.11.140:3002  max_fails=1 fail_timeout=10s;   # Backend B (Mac 4)
}

server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/certs/edge.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/certs/edge.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://backend_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503;
        add_header X-Edge mac2 always;
    }
}

# Validate:  nginx -t
# Reload:    nginx -s reload     (or: brew services restart nginx)
